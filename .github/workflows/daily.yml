name: Aggiorna Selezione Vini

on:
  schedule:
    - cron: '0 7 * * *'  # Esegue ogni giorno alle 07:00 UTC
  workflow_dispatch:      # Permette l'esecuzione manuale

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa dipendenze e Playwright
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Esegui generazione sito
        run: |
          python build_site.py

      - name: Commit e Push delle modifiche
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git status
          git commit -m "Aggiornamento automatico vini del giorno" || echo "Nessun cambiamento da committare"
          git push

