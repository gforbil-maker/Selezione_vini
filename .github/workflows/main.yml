name: Aggiorna Selezione Vini

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa dipendenze e Playwright
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Esegui generazione sito
        run: |
          python build_site.py

      - name: Commit e Push delle modifiche su Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Aggiornamento automatico vini del giorno" || echo "Nessun cambiamento"
          git push

      - name: Prepara artifact per Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.'

      - name: Deploy su GitHub Pages
        uses: actions/deploy-pages@v2

